<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff6b6b">
    <title>小吃货2 - 吃货大冒险</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1>🍔 小吃货2 🍟</h1>
            <h2>吃货大冒险</h2>
            <div class="login-form">
                <label for="playerName">请输入昵称：</label>
                <input type="text" id="playerName" maxlength="6" placeholder="最多6个字" autocomplete="off">
                <div class="name-tips">
                    <span id="nameError" class="error-msg"></span>
                </div>
                <button id="enterGameBtn" class="btn">进入游戏</button>
            </div>
        </div>
    </div>

    <div id="menu" class="menu hidden">
        <h1>🍔 小吃货2 🍟</h1>
        <h2>吃货大冒险</h2>
        <div class="user-info">欢迎 <span id="currentUserName">玩家</span></div>
        <div class="menu-stats">
            <p>总积分: <span id="totalScore">0</span></p>
            <p>通关关卡: <span id="completedLevels">0</span>/10</p>
            <p>成就: <span id="achievementCount">0</span>/7</p>
        </div>
        <button id="startBtn" class="btn">开始游戏</button>
        <button id="galleryBtn" class="btn">吃货图鉴</button>
        <button id="achievementsBtn" class="btn">成就列表</button>
        <button id="resetBtn" class="btn reset-btn">重置游戏</button>
        <button id="switchUserBtn" class="btn">切换账号</button>
    </div>

    <div id="levelSelect" class="level-select hidden">
        <h2>选择关卡</h2>
        <div class="levels-grid" id="levelsGrid"></div>
        <button id="backToMenu" class="btn">返回菜单</button>
    </div>

    <div id="game" class="game hidden">
        <div class="game-header">
            <button id="pauseBtn" class="btn pause">⏸ 暂停</button>
            <div class="level-info">第 <span id="currentLevel">1</span> 关</div>
            <div class="score-display">积分: <span id="currentScore">0</span></div>
        </div>
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>
            <div class="game-ui">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                    <span id="progressText">0/3</span>
                </div>
                <div class="timer-bar">
                    <div class="countdown-display" id="countdownDisplay">Time: 15s</div>
                    <div class="timer-fill" id="timerFill"></div>
                    <span id="timerText">15s</span>
                </div>
            </div>
        </div>
        
        <!-- 移动端虚拟控制按钮 - 固定在底部 -->
        <div class="mobile-controls hidden" id="mobileControls">
            <div class="control-left">
                <button id="btnLeft" class="ctrl-btn img-btn" ontouchstart="event.preventDefault()">
                    <img src="assets/ui/left.png" alt="左移" class="btn-img">
                </button>
                <button id="btnRight" class="ctrl-btn img-btn" ontouchstart="event.preventDefault()">
                    <img src="assets/ui/right.png" alt="右移" class="btn-img">
                </button>
            </div>
            <div class="control-right">
                <button id="btnEat" class="ctrl-btn eat-btn" ontouchstart="event.preventDefault()">🍴</button>
            </div>
        </div>
    </div>

    <div id="pauseMenu" class="pause-menu hidden">
        <h2>游戏暂停</h2>
        <button id="resumeBtn" class="btn">继续游戏</button>
        <button id="restartLevelBtn" class="btn">重新开始</button>
        <button id="quitToMenuBtn" class="btn">返回菜单</button>
    </div>

    <div id="levelResult" class="level-result hidden">
        <h2 id="resultTitle">🎉 通关成功!</h2>
        <div class="stars" id="stars"></div>
        <div class="result-info">
            <p>剩余时间: <span id="remainingTime">0</span>s</p>
            <p>获得积分: <span id="earnedScore">0</span></p>
            <p>总积分: <span id="newTotalScore">0</span></p>
        </div>
        <button id="nextLevelBtn" class="btn">下一关</button>
        <button id="replayBtn" class="btn">再玩一次</button>
        <button id="backToLevelsBtn" class="btn">返回关卡</button>
    </div>

    <div id="gallery" class="gallery hidden">
        <h2>🥘 吃货图鉴</h2>
        <div class="gallery-grid" id="galleryGrid"></div>
        <button id="galleryBackBtn" class="btn">返回</button>
    </div>

    <div id="achievements" class="achievements hidden">
        <h2>🏆 成就列表</h2>
        <div class="achievements-list" id="achievementsList"></div>
        <button id="achievementsBackBtn" class="btn">返回</button>
    </div>

    <div class="audio-controls">
        <button id="soundBtn" class="sound-btn">🔊</button>
        <div class="volume-control">
            <label for="bgmVolume">BGM</label>
            <input type="range" id="bgmVolume" min="0" max="1" step="0.01" value="0.3">
        </div>
        <div class="volume-control">
            <label for="sfxVolume">音效</label>
            <input type="range" id="sfxVolume" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <script src="levels.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
